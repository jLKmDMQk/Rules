name: Update Cloudflare Best IP

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-cloudflare-best-ip
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          path: source

      - name: Check out list branch
        uses: actions/checkout@v7
        with:
          ref: list
          path: list-output

      - name: Check out surge branch
        uses: actions/checkout@v7
        with:
          ref: surge
          path: surge-output

      - name: Generate Cloudflare best IP files
        working-directory: source
        run: |
          python3 ./Scripts/Others/cloudflare-best-ip.py
          cp ./result/list/cf-best-ip.list ../list-output/cf-best-ip.list
          cp ./result/list/cf-best-ip-hosts.list ../list-output/cf-best-ip-hosts.list
          cp ./result/surge/cloudflare-best-ip.sgmodule ../surge-output/cloudflare-best-ip.sgmodule

      - name: Commit and push list changes
        working-directory: list-output
        run: |
          git add -- cf-best-ip.list cf-best-ip-hosts.list
          if git diff --cached --quiet; then
            echo "Cloudflare best IP lists are unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cloudflare): update best IPs"
          git push

      - name: Commit and push Surge changes
        working-directory: surge-output
        run: |
          git add -- cloudflare-best-ip.sgmodule
          if git diff --cached --quiet; then
            echo "Cloudflare best IP Surge module is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cloudflare): update best IP Surge module"
          git push
